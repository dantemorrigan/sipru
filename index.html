<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sipru.</title>
  <meta name="theme-color" content="#F2EFE7" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- webfonts load without blocking first paint; local fallbacks cover offline -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="frame.css" />
  <link rel="stylesheet" href="tour.css" />
  <script>
    try {
      var raw = localStorage.getItem("sipru:v1");
      var t = raw ? (JSON.parse(raw).user || {}).theme : null;
      document.documentElement.setAttribute("data-theme", t || "light");
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- production React (vendored locally — no CDN, works offline) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="store.js"></script>
  <script src="i18n.js"></script>
  <script src="formats.js"></script>
  <!-- the text engine: the document schema every edit is normalised
       against. Loads before anything that can mutate a document. -->
  <script src="engine.js"></script>
  <!-- touch-only haptics; delegated from the document, so it must load
       before the app paints its first pressable element -->
  <script src="haptics.js"></script>
  <!-- JSX pre-compiled by `npm run build` (no in-browser Babel) -->
  <!-- generated from package.json; the update check compares against it -->
  <script src="build/version.js"></script>
  <script src="build/components.js"></script>
  <!-- the app frame (nav rail, contextual sidebar, mobile tab bar) that
       every screen renders inside -->
  <script src="build/shell.js"></script>
  <script src="build/screens-onboarding.js"></script>
  <script src="build/screens-dashboard.js"></script>
  <!-- the page engine (geometry, pagination, page setup) and the outline
       both back the editor screen, so they load just ahead of it -->
  <script src="build/editor-page.js"></script>
  <script src="build/editor-outline.js"></script>
  <script src="build/screens-editor.js"></script>
  <script src="build/screens-export.js"></script>
  <script src="build/screens-profile.js"></script>
  <script src="build/tour.js"></script>
  <script src="build/updater.js"></script>
  <!-- durable on-device storage. Loads after screens-export.js on purpose:
       it serializes chapters through that file's htmlToMd, and it reconnects
       a saved vault the moment it loads — so landing any earlier means the
       first write of every launch throws before it reaches the .md files. -->
  <script src="vault.js"></script>
  <script src="build/app.js"></script>
</body>
</html>
