<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Writed.</title>
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- webfonts load without blocking first paint; local fallbacks cover offline -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="tour.css" />
  <script>
    try {
      var raw = localStorage.getItem("writed:v1");
      var t = raw ? (JSON.parse(raw).user || {}).theme : null;
      document.documentElement.setAttribute("data-theme", t || "light");
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- production React (vendored locally — no CDN, works offline) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="store.js"></script>
  <script src="i18n.js"></script>
  <script src="formats.js"></script>
  <!-- JSX pre-compiled by `npm run build` (no in-browser Babel) -->
  <!-- generated from package.json; the update check compares against it -->
  <script src="build/version.js"></script>
  <script src="build/components.js"></script>
  <script src="build/screens-onboarding.js"></script>
  <script src="build/screens-dashboard.js"></script>
  <script src="build/screens-editor.js"></script>
  <script src="build/screens-export.js"></script>
  <script src="build/screens-profile.js"></script>
  <script src="build/tour.js"></script>
  <script src="build/updater.js"></script>
  <script src="build/app.js"></script>
</body>
</html>
