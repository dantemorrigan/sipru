name: Android build (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "*.jsx"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # local-cache restores a zipped NDK from the GH Actions cache, which
      # has been observed to extract incompletely (missing the clang
      # wrapper scripts under toolchains/llvm/prebuilt/.../bin, causing
      # "aarch64-linux-android24-clang not found"). Always doing a fresh
      # download+extract from Google is slower but reliable.
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false
          add-to-path: true

      # Only the ABIs real phones ship: arm64-v8a (every 64-bit device) and
      # armeabi-v7a (older 32-bit ones). i686/x86_64 are emulator-only and
      # were doubling the native payload for no real-device benefit.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install JS dependencies
        run: npm ci

      # gen/android isn't committed (it's generated, like gen/schemas for
      # desktop) — regenerated fresh from tauri.conf.json every run.
      - name: Initialize Android project
        run: npx tauri android init --ci
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # `tauri android init` generates its own launcher icon resources and
      # does not pick up the pre-made src-tauri/icons/android/ set (that
      # directory is `tauri icon`'s *output* location, not a documented
      # input for mobile init) — confirmed by testing an installed APK.
      # Overwrite the generated res/ files directly with ours.
      - name: Apply Writed. launcher icon
        run: |
          cp -rv src-tauri/icons/android/mipmap-* src-tauri/gen/android/app/src/main/res/
          cp -v src-tauri/icons/android/values/ic_launcher_background.xml src-tauri/gen/android/app/src/main/res/values/

      # Run the webview at the panel's full rate (120/90 Hz) instead of the
      # default mode. No-ops if the generated activity looks unfamiliar.
      - name: Enable adaptive refresh rate
        run: python3 .github/scripts/high_refresh_rate.py

      # An Android uninstall deletes the app's data directory, which is where
      # the webview keeps localStorage — so without this a reinstall started
      # from zero. Auto Backup restores it from the user's Drive instead.
      - name: Enable Android Auto Backup
        run: python3 .github/scripts/android_backup.py

      # Without a declared storage permission the vault's shared Documents/
      # Downloads locations fail every write under scoped storage, and the
      # app's Permissions screen has nothing to show at all.
      - name: Declare storage permissions
        run: python3 .github/scripts/android_storage_permissions.py

      # MANAGE_EXTERNAL_STORAGE has no ordinary runtime dialog — Android only
      # lets an app open the Settings screen for it. This does that once, on
      # first launch, which is the closest thing to the app "requesting" it.
      - name: Request all-files access on first launch
        run: python3 .github/scripts/android_request_storage_access.py

      # Universal APK = arm64 + armv7 in one file (no --split-per-abi), so a
      # single download works on any real phone. Debug-signed via Gradle's
      # built-in debug keystore — no signing setup needed, matching the macOS
      # build's "no Developer signing, free distribution" approach. The heavy
      # lifting on size is [profile.dev] in Cargo.toml stripping debug info.
      - name: Build Writed. for Android (universal APK)
        run: npx tauri android build --apk --debug --target aarch64 armv7
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CI: true

      - name: Locate APK output
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"

      - name: Rename APK to Writed-{version}-Android.apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(find src-tauri/gen/android/app/build/outputs/apk/universal/debug -name "*.apk" | head -1)
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/Writed-${VERSION}-Android.apk"
          ls -la dist-apk

      # Size report: the uploaded artifact is a zip, so its download size hides
      # the real on-device APK size. Print both, plus the per-ABI native libs.
      - name: Report APK size
        run: |
          APK=$(find dist-apk -name "*.apk" | head -1)
          echo "### APK size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| item | size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK (on device)** | $(du -h "$APK" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          unzip -l "$APK" | awk '/lib\/.*\.so$/ {printf "| lib %s | %.1f MB |\n", $4, $1/1048576}' >> $GITHUB_STEP_SUMMARY
          echo "--- native libs inside the APK ---"
          unzip -l "$APK" | grep '\.so$' || true
          du -h "$APK"

      - name: Upload Writed.apk
        uses: actions/upload-artifact@v4
        with:
          name: Writed-Android-apk
          path: dist-apk/Writed-*.apk
          if-no-files-found: error
