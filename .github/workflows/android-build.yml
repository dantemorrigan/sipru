name: Android build (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "*.jsx"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # local-cache restores a zipped NDK from the GH Actions cache, which
      # has been observed to extract incompletely (missing the clang
      # wrapper scripts under toolchains/llvm/prebuilt/.../bin, causing
      # "aarch64-linux-android24-clang not found"). Always doing a fresh
      # download+extract from Google is slower but reliable.
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false
          add-to-path: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install JS dependencies
        run: npm ci

      # gen/android isn't committed (it's generated, like gen/schemas for
      # desktop) — regenerated fresh from tauri.conf.json every run.
      - name: Initialize Android project
        run: npx tauri android init --ci
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # Universal APK = arm64 + armv7 + x86 + x86_64 in one file (no
      # --split-per-abi). Debug-signed via Gradle's built-in debug
      # keystore — no signing setup needed, matching the macOS build's
      # "no Developer signing, free distribution" approach.
      - name: Build Writed. for Android (universal APK)
        run: npx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CI: true

      - name: Locate APK output
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"

      - name: Rename APK to Writed-{version}-Android.apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SRC=$(find src-tauri/gen/android/app/build/outputs/apk/universal/debug -name "*.apk" | head -1)
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/Writed-${VERSION}-Android.apk"
          ls -la dist-apk

      - name: Upload Writed.apk
        uses: actions/upload-artifact@v4
        with:
          name: Writed-Android-apk
          path: dist-apk/Writed-*.apk
          if-no-files-found: error
