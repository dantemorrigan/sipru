name: Windows build (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "*.jsx"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# The repo is named "writed." (trailing dot). The runner always spawns every
# step — including uses: steps like actions/checkout — with its working
# directory forced to GITHUB_WORKSPACE, which on Windows defaults to
# D:\a\writed.\writed. (both segments taken from the repo name). Windows
# silently can't resolve a path component ending in a dot, so that step
# spawn fails before any step's own code runs, actions/checkout included —
# an explicit `path:` input on checkout does not help, since the failure
# happens before checkout's code even starts. Cloning by hand into a fixed
# path (C:\writed-src) with an explicit working-directory sidesteps the
# broken default workspace entirely.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (manual clone, see note above on the trailing-dot repo name)
        shell: pwsh
        working-directory: C:\
        run: |
          git clone --no-checkout https://github.com/${{ github.repository }}.git C:\writed-src
          cd C:\writed-src
          git checkout ${{ github.sha }}

      # No cache: input — actions/setup-node's cache-dependency-path glob
      # resolution doesn't cope with a working directory outside the
      # (broken, trailing-dot) default GITHUB_WORKSPACE. Not worth fighting
      # for a first build; can be revisited once this actually builds green.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JS dependencies
        shell: pwsh
        working-directory: C:\writed-src
        run: npm ci

      # NSIS installer, no code signing yet — same free-distribution approach
      # as the macOS build. WebView2 is preinstalled on Windows 11 and ships
      # with a bootstrapper download for Windows 10 machines that lack it
      # (see bundle.windows.webviewInstallMode in tauri.conf.json), so both
      # are covered. `tauri build` runs `npm run build` + stage-dist.js via
      # beforeBuildCommand.
      - name: Build Writed. for Windows
        shell: pwsh
        working-directory: C:\writed-src
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
        env:
          CI: true

      - name: Locate installer output
        shell: pwsh
        run: Get-ChildItem -Recurse C:\writed-src\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis

      - name: Upload Writed installer
        uses: actions/upload-artifact@v4
        with:
          name: Writed-Windows-installer
          path: C:\writed-src\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe
          if-no-files-found: error
