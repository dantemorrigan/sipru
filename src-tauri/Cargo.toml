[package]
name = "sipru"
version = "1.2.0"
description = "Sipru. — a minimal local-first editor for writers"
authors = ["Sipru."]
license = ""
repository = "https://github.com/dantemorrigan/writed."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
# Native save dialog + file write, used by export on Android (and desktop
# Tauri) instead of the browser-only <a download> flow.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# The vault folder's filesystem permission is granted at runtime, by the user
# picking it — a grant that lives only in memory. This persists the granted
# scopes across restarts so the vault stays writable after the app reopens.
tauri-plugin-persisted-scope = "2"
# "Show in files" — reveals a project folder or note file in the OS file manager.
tauri-plugin-opener = "2"

# The Android APK ships from `tauri android build --apk --debug`, which uses
# this profile — and cargo's default dev profile embeds full DWARF debug info,
# which was ~all of the ~500 MB APK (four ABIs x one unstripped .so each).
# Dropping debug info costs nothing at runtime and does not slow compiles;
# opt-level 1 keeps builds quick while giving the shell sane native codegen.
[profile.dev]
debug = false
strip = "debuginfo"
opt-level = 1

[profile.release]
opt-level = "s"     # the shell just hosts a webview; size beats micro-speed
lto = true
codegen-units = 1
strip = true
