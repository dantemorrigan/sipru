<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none"><rect x="0" y="0" width="1440" height="900" fill="#0e0e0c"/><rect x="0" y="0" width="1440" height="900" fill="#0e0e0c"/><text x="24.00" y="29.97" font-family="JetBrains Mono" font-size="11" letter-spacing="1.76" fill="#97907f" fill-opacity="0.50" xml:space="preserve">ГЛАВА 7 · ДОЖДЬ</text><g class="icon" transform="translate(1305,25) scale(0.7500,0.7500)" fill="none" stroke="#c4bdac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.60"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 1v2"></path><path d="M12 21v2"></path><path d="M4.2 4.2l1.4 1.4"></path><path d="M18.4 18.4l1.4 1.4"></path><path d="M1 12h2"></path><path d="M21 12h2"></path><path d="M4.2 19.8l1.4-1.4"></path><path d="M18.4 5.6l1.4-1.4"></path></g><g class="icon" transform="translate(1347,25) scale(0.7500,0.7500)" fill="none" stroke="#c4bdac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.60"><path d="M4 7V4.5h16V7"></path><path d="M9.5 20h5"></path><path d="M12 4.5v15.5"></path></g><g class="icon" transform="translate(1389,25) scale(0.7500,0.7500)" fill="none" stroke="#c4bdac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.60"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></g><text x="390.00" y="144.17" font-family="Source Serif 4" font-size="21" fill="#6a6456" xml:space="preserve">Она открыла тетрадь и написала первую строку — ту самую,</text><text x="390.00" y="183.01" font-family="Source Serif 4" font-size="21" fill="#6a6456" xml:space="preserve">которую переписывала уже семь раз.</text><text x="390.00" y="241.86" font-family="Source Serif 4" font-size="21" fill="#f0ece2" xml:space="preserve">Ветер трогал занавеску. В доме напротив кто-то зажёг лампу,</text><text x="390.00" y="280.70" font-family="Source Serif 4" font-size="21" fill="#f0ece2" xml:space="preserve">и жёлтое пятно легло на мокрый асфальт — так, будто город</text><text x="390.00" y="319.55" font-family="Source Serif 4" font-size="21" fill="#f0ece2" xml:space="preserve">на секунду вспомнил, что он живой.</text><rect x="777.05" y="303.38" width="2" height="22" fill="#e0713f"/><text x="575.89" y="869.97" font-family="JetBrains Mono" font-size="11" letter-spacing="1.54" fill="#6a6456" xml:space="preserve">640 СЛОВ ЗА СЕССИЮ</text><text x="744.42" y="869.97" font-family="JetBrains Mono" font-size="11" letter-spacing="1.54" fill="#6a6456" xml:space="preserve">·</text><text x="774.56" y="869.97" font-family="JetBrains Mono" font-size="11" letter-spacing="1.54" fill="#6a6456" xml:space="preserve">ESC — ВЫЙТИ</text></svg>