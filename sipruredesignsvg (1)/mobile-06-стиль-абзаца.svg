Глава начинается с тишины. За окном</text><text x="24.00" y="208.13" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">шёл дождь, и город растворялся в сером</text><text x="24.00" y="237.00" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">свете — так, будто кто-то методично</text><text x="24.00" y="265.88" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">стирал его резинкой с плотной бумаги.</text><text x="24.00" y="306.75" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">Она открыла тетрадь и написала первую</text><text x="24.00" y="335.63" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">строку — ту самую, которую</text><text x="24.00" y="364.50" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">переписывала уже семь раз. Ветер</text><text x="24.00" y="393.38" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">трогал занавеску.</text><rect x="173" y="380.42" width="2" height="17" fill="#c2542f"/><rect x="0" y="0" width="390" height="844" fill="#14120c" fill-opacity="0.420"/><rect x="0" y="325" width="390" height="519" rx="22.00" fill="#fbfaf6"/><line x1="0" y1="325.5" x2="390" y2="325.5" stroke="#ded7c6" stroke-width="1"/><rect x="175" y="340" width="40" height="4" rx="2.00" fill="#c0b8a3"/><text x="18.00" y="371.59" font-family="Inter" font-size="17" font-weight="600" letter-spacing="-0.34" fill="#16150f" xml:space="preserve">Стиль абзаца</text><g class="icon" transform="translate(353,358) scale(0.7917,0.7917)" fill="none" stroke="#7c7566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></g><text x="33.31" y="420.40" font-family="Source Serif 4" font-size="20" font-weight="600" fill="#7c7566" xml:space="preserve">Aa</text><text x="74.00" y="419.05" font-family="Inter