"88" y="803.81" width="217" height="76.19" rx="16.00" fill="#fbfaf6"/><rect x="88.5" y="804.31" width="216" height="75.19" rx="15.50" fill="none" stroke="#ded7c6" stroke-width="1"/><text x="103.00" y="825.78" font-family="JetBrains Mono" font-size="11" letter-spacing="2.20" fill="#7c7566" xml:space="preserve">СЕССИЯ</text><text x="103.00" y="851.36" font-family="JetBrains Mono" font-size="18" font-weight="500" fill="#16150f" xml:space="preserve">640</text><text x="141.41" y="851.74" font-family="Inter" font-size="12" fill="#7c7566" xml:space="preserve">слов за 42 мин</text><rect x="103" y="864" width="187" height="3" rx="1.50" fill="#e2dccb"/><rect x="103" y="864" width="119.67" height="3" rx="1.50" fill="#4f7a4b"/><rect x="322" y="0" width="1118" height="900" fill="#f2efe7"/><line x1="322" y1="59.5" x2="1440" y2="59.5" stroke="#ded7c6" stroke-width="1"/><g class="icon" transform="translate(355,20.5) scale(0.7500,0.7500)" fill="none" stroke="#4a463c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></g><text x="392.00" y="32.78" font-family="Inter" font-size="14" fill="#7c7566" xml:space="preserve">Тёмная сторона Луны</text><text x="553.33" y="32.78" font-family="Inter" font-size="14" fill="#7c7566" xml:space="preserve">/</text><text x="568.38" y="33.55" font-family="Inter" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#16150f" xml:space="preserve">Превью книги</text><rect x="966.44" y="10.5" width="223.8" height="38" rx="10.00" fill="#e9e4d8"/><rect x="966.94" y="11" width="222.8" height="37" rx="9.50" fill="none" stroke="#ded7c6" stroke-width="1"/><g class="icon" transform="translate(984.44,22) scale(0.6250,0.6250)" fill="none" stroke="#7c7566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></g><text x="1006.44" y="32.51" font-family="Inter" font-size="13" font-weight="500" fill="#7c7566" xml:space="preserve">Редактор</text><rect x="1083.02" y="14.5" width="103.22" height="30" rx="8.00" fill="#fbfaf6"/><rect x="1083.52" y="15" width="102.22" height="29" rx="7.50" fill="none" stroke="#ded7c6" stroke-width="1"/><g class="icon" transform="translate(1098.02,22) scale(0.6250,0.6250)" fill="none" stroke="#16150f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></g><text x="1120.02" y="32.51" font-family="Inter" font-size="13" font-weight="500" fill="#16150f" xml:space="preserve">Превью</text><rect x="1206.23" y="12.5" width="82.81" height="34" rx="8.00" fill="#fbfaf6"/><rect x="1206.73" y="13" width="81.81" height="33" rx="7.50" fill="none" stroke="#ded7c6" stroke-width="1"/><text x="1215.23" y="32.74" font-family="JetBrains Mono" font-size="12" fill="#16150f" xml:space="preserve">− 100 % +</text><rect x="1305.05" y="10.5" width="110.95" height="38" rx="10.00" fill="#c2542f"/><rect x="1305.55" y="11" width="109.95" height="37" rx="9.50" fill="none" stroke="#c2542f" stroke-width="1"/><g class="icon" transform="translate(1322.05,21.5) scale(0.6667,0.6667)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></g><text x="1346.05" y="32.51" font-family="Inter" font-size="13" font-weight="500" letter-spacing="-0.13" fill="#ffffff" xml:space="preserve">Экспорт</text><rect x="322" y="60" width="1118" height="806" fill="#e9e4d8"/><rect x="489" y="94" width="380" height="356.27" rx="3.00" fill="#fffdf8"/><rect x="489.5" y="94.5" width="379" height="355.27" rx="2.50" fill="none" stroke="#ded7c6" stroke-width="1"/><text x="546.00" y="119.43" font-family="JetBrains Mono" font-size="9" letter-spacing="0.90" fill="#a9a292" xml:space="preserve">ТЁМНАЯ СТОРОНА ЛУНЫ</text><text x="761.59" y="119.43" font-family="JetBrains Mono" font-size="9" letter-spacing="0.90" fill="#a9a292" xml:space="preserve">ЧАСТЬ II</text><text x="536.00" y="155.36" font-family="Source Serif 4" font-size="18" font-weight="600" letter-spacing="-0.18" fill="#16150f" xml:space="preserve">Глава седьмая. Дождь</text><text x="536.00" y="192.27" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">Глава начинается с тишины. За окном шёл</text><text x="536.00" y="214.14" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">дождь, и город растворялся в сером свете —</text><text x="536.00" y="236.02" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">так, будто кто-то методично стирал его</text><text x="536.00" y="257.89" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">резинкой с плотной бумаги.</text><text x="536.00" y="289.77" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">Она открыла тетрадь и написала первую</text><text x="536.00" y="311.64" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">строку — ту самую, которую переписывала</text><text x="536.00" y="333.52" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">уже семь раз. Ветер трогал занавеску.</text><text x="536.00" y="365.39" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">В доме напротив кто-то зажёг лампу, и</text><text x="536.00" y="387.27" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">жёлтое пятно легло на мокрый асфальт.</text><text x="672.69" y="428.70" font-family="JetBrains Mono" font-size="9" letter-spacing="0.90" fill="#a9a292" xml:space="preserve">12</text><rect x="893" y="94" width="380" height="316.88" rx="3.00" fill="#fffdf8"/><rect x="893.5" y="94.5" width="379" height="315.88" rx="2.50" fill="none" stroke="#ded7c6" stroke-width="1"/><text x="950.00" y="119.43" font-family="JetBrains Mono" font-size="9" letter-spacing="0.90" fill="#a9a292" xml:space="preserve">ТЁМНАЯ СТОРОНА ЛУНЫ</text><text x="1165.59" y="119.43" font-family="JetBrains Mono" font-size="9" letter-spacing="0.90" fill="#a9a292" xml:space="preserve">ЧАСТЬ II</text><text x="940.00" y="152.88" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">«Значит, всё-таки началось», — подумала она</text><text x="940.00" y="174.75" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">и подчеркнула слово дважды, хотя знала, что</text><text x="940.00" y="196.63" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">утром вычеркнет и его.</text><text x="940.00" y="228.50" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">Дом напротив был из тех, что помнят</text><text x="940.00" y="250.38" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">больше своих жильцов. Каждый вечер в нём</text><text x="940.00" y="272.25" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">зажигалась одна и та же лампа, и каждый</text><text x="940.00" y="294.13" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">вечер кто-то невидимый садился за стол.</text><text x="940.00" y="326.00" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">Она давно перестала гадать, кто это. Важнее</text><text x="940.00" y="347.88" font-family="Source Serif 4" font-size="12.5" fill="#16150f" xml:space="preserve">было, что лампа зажигается.</text><text x="1076.69" y="389.31" font-family="JetBrains Mono" font-size="9" letter-spacing="0.90" fill="#a9a292" xml:space="preserve">13</text><rect x="322" y="866" width="1118" height="34" fill="#f2efe7"/><line x1="322" y1="866.5" x2="1440" y2="866.5" stroke="#ded7c6" stroke-width="1"/><text x="342.00" y="885.97" font-family="JetBrains Mono" font-size="11" fill="#7c7566" xml:space="preserve">РАЗВОРОТ 6 ИЗ 107</text><text x="462.20" y="885.97" font-family="JetBrains Mono" font-size="11" fill="#7c7566" xml:space="preserve">·</text><text x="476.81" y="885.97" font-family="JetBrains Mono" font-size="11" fill="#7c7566" xml:space="preserve">A4 · КНИЖНАЯ · ПОЛЯ 20/18</text><text x="1182.39" y="885.97" font-family="JetBrains Mono" font-size="11" fill="#7c7566" xml:space="preserve">SOURCE SERIF 12 PT · ИНТЕРЛИНЬЯЖ 1.5</text></svg>