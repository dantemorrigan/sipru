Глава начинается с тишины. За окном</text><text x="24.00" y="208.13" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">шёл дождь, и город растворялся в сером</text><text x="24.00" y="237.00" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">свете — так, будто кто-то методично</text><text x="24.00" y="265.88" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">стирал его резинкой с плотной бумаги.</text><text x="24.00" y="306.75" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">Она открыла тетрадь и написала первую</text><text x="24.00" y="335.63" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">строку — ту самую, которую</text><text x="24.00" y="364.50" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">переписывала уже семь раз. Ветер</text><text x="24.00" y="393.38" font-family="Source Serif 4" font-size="16.5" fill="#16150f" xml:space="preserve">трогал занавеску.</text><rect x="173" y="380.42" width="2" height="17" fill="#c2542f"/><rect x="0" y="728" width="390" height="52" fill="#fbfaf6"/><line x1="0" y1="728.5" x2="390" y2="728.5" stroke="#ded7c6" stroke-width="1"/><g class="icon" transform="translate(18.39,745) scale(0.7917,0.7917)" fill="none" stroke="#4a463c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4H13a4 4 0 0 1 0 8H6.5z"></path><path d="M6.5 12H14a4 4 0 0 1 0 8H6.5z"></path></g><rect x="49.78" y="738.5" width="39.78" height="32" rx="8.00" fill="#f2ded5"/><g class="icon" transform="translate(60.17,745) scale(0.7917,0.7917)" fill="none" stroke="#c2542f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4h-9"></path><path d="M14 20H5"></path><path d="M15 4L9 20"></path></g><g class="icon" transform="translate(101.95,745) scale(0.7917,0.7917)" fill="none" stroke="#4a463c" stroke-width="1.5" stroke-linecap